<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marseille - agenda des lieux</title>
<link rel="alternate" type="text/calendar" href="./events.ics">
<style>
  :root {
    --bg: #fbfaf7; --fg: #1d1d1b; --muted: #6b6a66; --line: #e4e2dc; --cell: #ffffff; --cell-past: #efede8; --accent: #c2410c;
    --panel: #ffffff; --shadow: 0 10px 30px rgba(0,0,0,.12);
    --c-culture: #c2410c; --c-milite: #b91c1c; --c-cinema: #6d28d9; --c-ateliers: #0f766e; --c-ceramique: #a16207;
    --c-bars: #be185d; --c-mer: #0369a1; --c-sport: #15803d; --c-coop: #4d7c0f; --c-amap: #65a30d; --c-macon: #57534e; --c-autre: #475569;
    --slot-h: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151515; --fg: #ececea; --muted: #9a9993; --line: #2a2a2a; --cell: #1c1c1c; --cell-past: #171716; --accent: #f97316; --panel: #1f1f1f; --shadow: 0 10px 30px rgba(0,0,0,.6); }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; }
  button, .chip, input { font: inherit; border: 1px solid var(--line); background: var(--cell); color: var(--fg); border-radius: 8px; padding: 5px 10px; }
  button, .chip { cursor: pointer; }
  button:hover, .chip:hover { border-color: var(--muted); }
  button:focus-visible, .chip:focus-visible, input:focus-visible, .opt:has(input:focus-visible) { outline: 2px solid var(--fg); outline-offset: 1px; }
  .pop:focus, .panel:focus, .mbox:focus { outline: none; }
  .lnk { border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 2px 4px; cursor: pointer; font: inherit; }
  .lnk:hover { color: var(--fg); }
  /* ---- header: identical in both views, never moves ---- */
  header { display: flex; flex-direction: column; gap: 8px; padding: 10px 16px 6px; border-bottom: 1px solid var(--line); flex: none; }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .tabs button { border: 0; border-radius: 0; background: transparent; color: var(--muted); padding: 6px 14px; }
  .tabs button + button { border-left: 1px solid var(--line); }
  .tabs button.on { background: var(--cell); color: var(--fg); font-weight: 600; }
  .count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 5px; border-radius: 999px; background: color-mix(in srgb, var(--fg) 8%, transparent); font-size: 11px; font-weight: 600; text-align: center; }
  /* filter bar: type chips + "Filtres" button, recap below */
  .filters { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "types filters" "recap recap"; gap: 8px 12px; align-items: center; }
  .scrollx { grid-area: types; min-width: 0; }
  .fwrap { grid-area: filters; position: relative; justify-self: end; }
  .recap { grid-area: recap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
  .chip .k { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .chip.muted:not(.on) { opacity: .45; }
  .chip.type.on { background: var(--c); border-color: var(--c); color: #fff; }
  .chip.type.on .dot { background: rgba(255,255,255,.85); }
  .chip.type.on .k { color: rgba(255,255,255,.8); }
  #filtersBtn.on { border-color: var(--fg); font-weight: 600; }
  #filtersBtn .car { font-size: 10px; margin-left: 2px; color: var(--muted); }
  .recap { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 12.5px; }
  .recap[hidden] { display: none; }
  .recap .lbl { color: var(--muted); margin-right: 2px; }
  .tag { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 12.5px; background: var(--cell); }
  .tag .x { color: var(--muted); font-size: 14px; line-height: 1; }
  .tag:hover .x { color: var(--fg); }
  .tag .k { color: var(--muted); font-size: 11.5px; }
  .tag button.x { border: 0; background: none; padding: 0 2px; cursor: pointer; }
  .recap .clear { margin-left: auto; }
  /* second row: sub-tabs + search (Liste) or month navigation (Agenda); same height in both views */
  .sub { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
  .subtabs { display: flex; gap: 4px; }
  .subtabs button { border: 0; background: transparent; color: var(--muted); padding: 8px 10px; border-radius: 8px; white-space: nowrap; }
  .subtabs button:hover { color: var(--fg); }
  .subtabs button.on { color: var(--fg); font-weight: 600; background: color-mix(in srgb, var(--fg) 7%, transparent); }
  .nav { display: flex; align-items: center; gap: 10px; }
  .nav .month { font-size: 16px; font-weight: 600; min-width: 170px; text-transform: capitalize; }
  .search input { width: 280px; max-width: 100%; padding: 8px 10px; }
  .search input::placeholder { color: var(--muted); }
  body[data-view="agenda"] .subtabs, body[data-view="agenda"] .sub .search, body[data-view="agenda"] .liste { display: none; }
  body[data-view="liste"] .nav, body[data-view="liste"] .agendaView { display: none; }
  /* Carte is independent of the facets: no filter bar, no sub row */
  body[data-view="carte"] .filters, body[data-view="carte"] #subtabs, body[data-view="carte"] .sub .nav, body[data-view="carte"] .sub .search, body[data-view="carte"] .liste, body[data-view="carte"] .agendaView { display: none; }
  body:not([data-view="carte"]) #carteTabs { display: none; }
  body:not([data-view="carte"]) .carteView { display: none; }
  /* meta line: venues button, freshness, info popover */
  .meta { display: flex; justify-content: flex-end; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .meta .lnk { font-size: 12px; }
  .iwrap { position: relative; display: inline-flex; }
  .info { width: 20px; height: 20px; border-radius: 50%; padding: 0; font: italic 600 12px/18px Georgia, "Times New Roman", serif; color: var(--muted); }
  .tip { position: absolute; right: 0; top: calc(100% + 6px); min-width: 240px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 10px 12px; font-size: 12.5px; color: var(--fg); text-align: left; z-index: 20; }
  .tip[hidden] { display: none; }
  .tip p { margin: 3px 0; }
  .tip .muted { color: var(--muted); }
  .tip a { color: var(--fg); }
  /* popover (desktop) / bottom sheet (mobile) with level-2 facets */
  .pop { position: absolute; top: calc(100% + 6px); right: 0; width: 420px; max-width: calc(100vw - 32px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); z-index: 20; }
  .pop[hidden] { display: none; }
  .pop-body { padding: 4px 14px 12px; }
  .pop h4 { margin: 12px 0 6px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; }
  .opt { display: flex; align-items: center; gap: 7px; padding: 3px 4px; border-radius: 6px; cursor: pointer; min-width: 0; font-size: 13px; }
  .opt .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .opt:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
  .opt.muted:not(.on) { opacity: .45; }
  .opt input { margin: 0; padding: 0; width: 15px; height: 15px; accent-color: var(--fg); }
  .opt .k, .vopt .k { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .pop .search input, .panel .search input { width: 100%; }
  .vlist { list-style: none; margin: 6px 0 0; padding: 0; max-height: 176px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
  .vopt { display: flex; align-items: center; gap: 7px; padding: 4px 8px 4px 4px; cursor: pointer; }
  .vopt[hidden] { display: none; }
  .vopt.active { background: color-mix(in srgb, var(--fg) 8%, transparent); }
  .vopt.muted:not([aria-selected="true"]) { opacity: .5; }
  .vopt[aria-selected="true"] .name { font-weight: 600; }
  .vopt[aria-selected="true"] .name::after { content: " \2713"; color: var(--muted); font-weight: 400; }
  .dot, .pin { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
  .vopt .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .sel { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .sel[hidden] { display: none; }
  .pop-foot { display: flex; justify-content: flex-end; margin-top: 14px; }
  .sheet-head, .sheet-foot, .backdrop { display: none; }
  /* ---- main ---- */
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: auto; }
  body[data-view="agenda"] main { overflow: hidden; }
  .liste { padding: 12px 16px 40px; }
  .lead { font-size: 15px; font-weight: 600; margin: 2px 0 12px; }
  h3.group { font-size: 13px; color: var(--muted); font-weight: 600; margin: 18px 0 8px; }
  h3.group:first-child { margin-top: 0; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; align-content: start; }
  .more { margin-top: 22px; text-align: center; }
  .empty { padding: 32px 16px; text-align: center; color: var(--muted); }
  .empty p { margin: 6px 0; }
  .empty .lnk { color: var(--fg); }
  /* card component (Liste sub-tabs, mobile agenda). No overflow:hidden: a scroll container would let the grid squeeze rows */
  .card { display: flex; flex-direction: column; background: var(--cell); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .card:hover { border-color: var(--muted); }
  /* the placeholder keeps the banner ratio so every card of a row has the same height */
  .card .vis { aspect-ratio: 3 / 2; width: 100%; border-radius: 7px 7px 0 0; }
  .card .body { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; }
  .card .venue { display: flex; align-items: center; gap: 6px; color: var(--c); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
  .card .title { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
  .card.cancelled .title { text-decoration: line-through; }
  .card .dates { color: var(--muted); font-size: 12.5px; }
  .card .hintline { font-size: 12.5px; color: var(--muted); }
  .card .hintline.soon { color: #b91c1c; font-weight: 600; }
  .card .hintline.upcoming { color: var(--fg); }
  .card a { margin-top: 4px; font-size: 12px; color: var(--muted); align-self: flex-start; }
  /* event visuals: tinted box (category colour) holding the image, or the "pas de visuel" placeholder */
  .vis { position: relative; overflow: hidden; flex: none; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--c) 12%, var(--cell)); }
  .vis img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .vis.ph span { font-size: 11.5px; color: var(--muted); letter-spacing: .02em; }
  /* ---- Agenda: month grid with a per-week slot model ---- */
  .agendaView { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .grid { flex: 1; display: flex; flex-direction: column; min-height: 0; --slots: 5; }
  .dows { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); height: 28px; flex: none; }
  .dow { padding: 6px 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--line); }
  .week { position: relative; flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .cell { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--cell); padding: 4px 6px 0; overflow: hidden; min-width: 0; }
  .cell.we { background: color-mix(in srgb, var(--fg) 3%, var(--cell)); }
  .cell.out { background: transparent; opacity: .5; }
  /* past days: the whole cell takes a muted tint, number and events fade; today: accent circle on the number only */
  .cell.past { background: var(--cell-past); }
  .cell.today { background: color-mix(in srgb, var(--accent) 5%, var(--cell)); }
  .cell .d { height: 19px; line-height: 19px; font-size: 12px; color: var(--muted); }
  .cell.past .d { color: color-mix(in srgb, var(--muted) 60%, transparent); }
  .cell.today .d span { display: inline-block; min-width: 19px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600; text-align: center; }
  .cell.past .slots, .bar.past { opacity: .5; }
  .slots { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: repeat(var(--slots), var(--slot-h)); }
  .slots .ev { height: calc(var(--slot-h) - 3px); margin: 0; align-items: center; }
  .slots .ev .pin { align-self: center; margin-top: 0; }
  .ev.more { border: 0; justify-content: center; background: color-mix(in srgb, var(--fg) 7%, transparent); color: var(--muted); font-weight: 600; }
  .ev.more:hover { background: color-mix(in srgb, var(--fg) 14%, transparent); color: var(--fg); }
  /* multi-day bars (short runs), absolutely positioned over the week row, aligned on the same slot rows */
  .bar { position: absolute; top: calc(23px + var(--row) * var(--slot-h)); left: calc(var(--c0) * 100% / 7); width: calc(var(--span) * 100% / 7); height: calc(var(--slot-h) - 3px); z-index: 1; display: flex; align-items: center; padding: 0 5px; background: color-mix(in srgb, var(--c) 18%, var(--cell)); cursor: pointer; font-size: 12px; line-height: 1; overflow: hidden; }
  .bar.s { margin-left: 4px; width: calc(var(--span) * 100% / 7 - 4px); border-radius: 5px 0 0 5px; gap: 5px; }
  .bar.e { width: calc(var(--span) * 100% / 7 - 4px); border-radius: 0 5px 5px 0; }
  .bar.s.e { width: calc(var(--span) * 100% / 7 - 8px); border-radius: 5px; }
  .bar:not(.s) .n { color: var(--muted); }
  .bar:hover { background: color-mix(in srgb, var(--c) 32%, var(--cell)); }
  .bar .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .bar.cancelled .n { text-decoration: line-through; }
  .ev { display: flex; gap: 5px; align-items: center; padding: 2px 6px; border-radius: 5px; background: color-mix(in srgb, var(--c) 9%, transparent); cursor: pointer; font-size: 12.5px; line-height: 1.25; }
  .ev:hover { background: color-mix(in srgb, var(--c) 20%, transparent); }
  .ev .t { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; font-size: 11.5px; }
  .ev .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .ev.cancelled .n { text-decoration: line-through; }
  /* mobile mini-month */
  .mini, .miniLead, .miniCards { display: none; }
  /* ---- Carte: venues sorted by bike time (left) + MapLibre map (right) ---- */
  body[data-view="carte"] main { overflow: hidden; }
  .carteView { flex: 1; display: flex; min-height: 0; }
  .clist { width: 340px; flex: none; overflow: auto; border-right: 1px solid var(--line); padding: 12px 12px 24px; }
  .clist .lead { margin: 0 0 2px; }
  .cnote { margin: 0 0 6px; font-size: 12px; color: var(--muted); }
  .cnote:empty { display: none; }
  /* cards: an event (today / this week) or a venue ("Tout"); headers are days or genres */
  .ccards { list-style: none; margin: 4px 0 0; padding: 0; }
  .chead { position: sticky; top: -12px; z-index: 1; display: flex; align-items: center; gap: 6px; margin: 0 -12px; padding: 14px 12px 6px; background: var(--bg); color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .chead .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .chead .k { margin-left: auto; font-weight: 500; letter-spacing: 0; text-transform: none; }
  .ccard { --c: var(--c-autre); display: flex; gap: 10px; margin: 0 -6px 2px; padding: 7px 6px; border-radius: 8px; cursor: pointer; transition: background .12s; }
  .ccard:hover, .ccard.hover { background: var(--cell); }
  .ccard.on { background: color-mix(in srgb, var(--c) 14%, transparent); }
  .ccard .cthumb { flex: none; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: color-mix(in srgb, var(--c) 22%, var(--cell)) center / cover no-repeat; color: var(--c); font-size: 20px; font-weight: 700; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fg) 8%, transparent); }
  .ccard .cbody { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  .ccard .cmeta { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--muted); font-size: 12px; }
  .ccard .cwhen { flex: none; color: var(--fg); font-weight: 650; font-variant-numeric: tabular-nums; }
  .ccard .cvenue { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .ccard .cvenue .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .ccard .cvenue span:last-child, .ccard .cfoot { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .ccard .ctitle { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; padding: 0; border: 0; background: none; color: var(--fg); font: inherit; font-size: 13.5px; font-weight: 600; line-height: 1.3; text-align: left; cursor: pointer; }
  .ccard button.ctitle:hover { text-decoration: underline; }
  .ccard .cfoot { color: var(--muted); font-size: 11.5px; }
  .ccard.cancelled .ctitle { text-decoration: line-through; }
  /* own stacking context: map markers and popups must stay under the modal and panels */
  .cmap { flex: 1; min-width: 0; position: relative; z-index: 0; isolation: isolate; background: var(--cell); }
  .cmap .cfail { padding: 32px 16px; text-align: center; color: var(--muted); }
  /* venue sheet: replaces the list in the left panel while a venue is selected */
  .clist.detail > .lead, .clist.detail > .cnote, .clist.detail > .ccards { display: none; }
  .clist:not(.detail) > .cdetail { display: none; }
  .cdetail { --c: var(--c-autre); }
  .cdetail .cback { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 10px -4px; padding: 4px 8px 4px 4px; border: 0; border-radius: 6px; background: none; color: var(--muted); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .cdetail .cback:hover { background: var(--cell); color: var(--fg); }
  .cdetail .dhero { height: 150px; margin: 0 0 12px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: color-mix(in srgb, var(--c) 22%, var(--cell)) center / cover no-repeat; color: var(--c); font-size: 44px; font-weight: 700; }
  .cdetail .ccat { display: flex; align-items: center; gap: 6px; color: var(--c); font-weight: 650; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .cdetail .ccat .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .cdetail .dname { margin: 4px 0 4px; font-size: 21px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; }
  .cdetail .dlinks { display: flex; gap: 12px; font-size: 12.5px; }
  .cdetail .dlinks a { color: var(--muted); }
  .cdetail .dlinks a:hover { color: var(--fg); }
  .cdetail .cempty { margin: 6px 0; color: var(--muted); font-size: 13px; }
  .cdetail .ccards { margin-top: 2px; }
  /* list: one card per venue, its events of the period inside */
  .cgroup { --c: var(--c-autre); margin: 0 -6px 4px; padding: 8px 6px; border-radius: 10px; cursor: pointer; transition: background .12s; }
  .cgroup:hover, .cgroup.hover { background: var(--cell); }
  .cgroup.on { background: color-mix(in srgb, var(--c) 14%, transparent); }
  .cgroup .ghead { display: flex; align-items: center; gap: 10px; }
  .cgroup .cthumb { width: 48px; height: 48px; }
  .cgroup .gname { font-weight: 650; font-size: 14.5px; line-height: 1.25; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .cgroup .gmeta { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .cgroup .gmeta .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .cgroup .grows { list-style: none; margin: 6px 0 0 58px; padding: 0; }
  .cgroup .grow { display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 3px 0; border: 0; background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
  .cgroup .grow .cwhen { flex: none; min-width: 38px; font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .cgroup .grow .gt { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; }
  .cgroup .grow:hover .gt { text-decoration: underline; }
  .cgroup .grow.cancelled .gt { text-decoration: line-through; color: var(--muted); }
  .cgroup .gmore { margin: 2px 0 0 58px; color: var(--muted); font-size: 12px; }
  .cgroup.muted .cthumb, .cgroup.muted .gname { opacity: .55; }
  /* venue bubbles: the marker element's own transform belongs to MapLibre, so effects go on the inner .cb */

<script>
(async function () {
  const DATA_URLS = ['./events.json', '../data/events.json'];
  const $ = (id) => document.getElementById(id);
  const fmtMonth = new Intl.DateTimeFormat('fr-FR', { month: 'long', year: 'numeric' });
  const fmtMonthLong = new Intl.DateTimeFormat('fr-FR', { month: 'long' });
  const fmtDay = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });

  const DOW = ['lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'];
  // Multi-day ranges longer than this (end_date - start_date, in days) are exhibitions: they live in the
  // "Expositions" sub-tab; shorter ranges are drawn as bars in the month grid and as cards in the day lists.
  const LONG_RUN_DAYS = 7;
  const SLOT_H = 20; // px, one row of the month grid slot model (must match --slot-h)
  const CATEGORIES = { culture: 'Culture', milite: 'Militant', cinema: 'Cinéma', bars: 'Bars', ateliers: 'Ateliers', ceramique: 'Céramique', mer: 'Mer', sport: 'Sport', coop: 'Coop', amap: 'AMAP', macon: 'Maçonnerie', autre: 'Autre' };
  const TABS = { aujourdhui: "Aujourd'hui", semaine: 'Cette semaine', expos: 'Expositions', tout: 'Tout' };
  const STATUS = { cancelled: 'Annulé', postponed: 'Reporté', sold_out: 'Complet' };
  // Neighbourhood centroids; a venue belongs to the nearest one (client-side, from its lat/lng).
  const AREAS = [
    { slug: 'belle-de-mai', name: 'Belle de Mai', full: 'Belle de Mai', lat: 43.311, lng: 5.389 },
    { slug: 'la-plaine', name: 'La Plaine', full: 'La Plaine / Cours Julien', lat: 43.294, lng: 5.383 },
    { slug: 'noailles', name: 'Noailles', full: 'Noailles / Canebière', lat: 43.296, lng: 5.379 },
    { slug: 'panier', name: 'Le Panier', full: 'Le Panier / Vieux-Port', lat: 43.298, lng: 5.368 },

  const LNG_SCALE = Math.cos(43.3 * Math.PI / 180); // one degree of longitude is shorter than one of latitude here
  // Ported from src/marseille_agenda/filters.py::_SPECIAL_SCREENING; applied to folded (lowercase, accent-free) text.
  const SPECIAL = /\b(?:debat|discussion|rencontre|echange|en presence|presente par|suivie? d|precedee? d|anime par|avant[- ]premiere|premiere|preview|cine[- ]?club|cine[- ]?concert|cine[- ]?bistro|cine[- ]?goute|cine[- ]?quiz|quiz|seance speciale|seance unique|soiree speciale|soiree|nuit du|marathon|festival|retrospective|cycle|carte blanche|hommage|masterclass|conference|lecon de cinema|atelier|workshop|braderie|anniversaire|fete|vernissage|exposition|projection[- ]debat|projection[- ]rencontre|ouverture|cloture|inauguration|invite|realisateur|realisatrice|equipe du film|interprete|gratuit|entree libre)/;

  const venues = data.venues;
  const venueById = Object.fromEntries(venues.map(v => [v.id, v]));
  const byUid = new Map(events.map(e => [e.uid, e]));
  const color = (e) => `var(--c-${e.category || 'autre'}, var(--c-autre))`;
  const todayStr = data.today || new Date().toISOString().slice(0, 10);
  const currentMonth = todayStr.slice(0, 7);

  const generated = new Date(data.generated_at);
  $('maj').textContent = `maj ${generated.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}`;
  $('infoUpdated').textContent = `Mis à jour le ${generated.toLocaleDateString('fr-FR', { dateStyle: 'medium' })} à ${generated.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}`;
  $('lieuxBtn').textContent = `${venues.length} lieux`;

  // Last run report: LLM credits left (informational, muted).
  for (const u of ['./report.json', '../data/report.json']) {
    try {
      const r = await fetch(u, { cache: 'no-store' });
      if (!r.ok) continue;
      const rep = await r.json();
      if (rep.credits_remaining_usd != null) {
        $('infoCredits').textContent = `Crédits LLM restants : ${rep.credits_remaining_usd.toLocaleString('fr-FR', { maximumFractionDigits: 2 })} $`;
        $('infoCredits').hidden = false;
      }
      break;
    } catch (e) { /* try next */ }
  }

  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const dateOf = (k) => new Date(k + 'T00:00:00');
  const dayDiff = (a, b) => Math.round((dateOf(b) - dateOf(a)) / 86400000);
  const hasTime = (e) => !!e.start_time && e.start_time.slice(0, 5) !== '00:00';
  const hhmm = (t) => t.slice(0, 5).replace(':', 'h');
  const timeLabel = (e) => hasTime(e) ? hhmm(e.start_time) : '';
  // Client-side classification of date ranges: single day, short run (bars in the grid), long run (exhibition).
  const spanDays = (e) => e.end_date && e.end_date > e.start_date ? dayDiff(e.start_date, e.end_date) : 0;
  const isRange = (e) => spanDays(e) > 0;
  const isLongRun = (e) => spanDays(e) > LONG_RUN_DAYS;
  const covers = (e, from, to) => e.start_date <= to && (e.end_date || e.start_date) >= from;
  const thisYear = dateOf(todayStr).getFullYear();
  // Day + month, with the year appended only when it is not the current one.
  const fmtDate = (k) => (dateOf(k).getFullYear() === thisYear ? fmtShort : fmtShortYear).format(dateOf(k));
  const fmtRange = (e) => `du ${fmtDate(e.start_date)} au ${fmtDate(e.end_date)}`;
  const plural = (n, w) => `${n} ${w}${n > 1 ? 's' : ''}`;
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  const timeKey = (e) => e.start_time || '99'; // events without a time sort last
  const byTime = (a, b) => timeKey(a).localeCompare(timeKey(b));
  const monthBounds = (m) => { const d = dateOf(m + '-01'); return [iso(d), iso(new Date(d.getFullYear(), d.getMonth() + 1, 0))]; };
  // "Cette semaine": today through next Sunday (through the following Sunday when today is a Sunday).
  const weekWindow = () => { const t = dateOf(todayStr), dow = (t.getDay() + 6) % 7; return { from: todayStr, to: iso(addDays(t, dow === 6 ? 7 : 6 - dow)) }; };

  // ---- Facet data -------------------------------------------------------------------------

  // Lowercase, accent-free, whitespace-collapsed text (mirrors validate.normalize + strip_accents).
  const fold = (s) => String(s ?? '').normalize('NFKC').replace(/[\u2018\u2019]/g, "'").replace(/[\u201c\u201d]/g, '"').replace(/[\u00a0\u202f]/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');
  for (const e of events) {
    e._q = fold(`${e.title} ${e.venue_name} ${e.summary || ''}`);
    e._special = SPECIAL.test(fold(`${e.title} ${e.summary || ''}`));
  }
  function areaOf(v) {
    if (v.lat == null || v.lng == null) return null;
    let best = null, bestD = Infinity;
    for (const a of AREAS) {
      const dy = a.lat - v.lat, dx = (a.lng - v.lng) * LNG_SCALE, d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = a.slug; }
    }
    return best;
  }
  const venueArea = Object.fromEntries(venues.map(v => [v.id, areaOf(v)]));
  const areaOptions = AREAS.filter(a => venues.some(v => venueArea[v.id] === a.slug));
  const areaName = (slug) => (AREAS.find(a => a.slug === slug) || {}).name || slug;
  const typeOptions = Object.keys(CATEGORIES).filter(t => events.some(e => (e.category || 'autre') === t));
  const venueOptions = [...venues].sort((a, b) => a.name.localeCompare(b.name, 'fr'));

  // The favourites feature is gone; drop the value older versions of the page stored.
  try { localStorage.removeItem('agenda.favoriteVenues'); } catch (e) { /* ignore */ }

  // ---- State <-> URL hash -----------------------------------------------------------------

  // Single source of truth. Routes: #liste/aujourdhui | #liste/semaine | #liste/expos | #liste/tout | #liste/jour?day=YYYY-MM-DD | #agenda?m=YYYY-MM | #carte?quand=semaine|tout
  // Query params: type, area, venue, free, special, q (Liste only), ev (open event), lieux=1 (venues panel).
  const state = { view: 'liste', tab: 'aujourdhui', day: null, month: currentMonth, types: new Set(), areas: new Set(), venues: new Set(), free: false, special: false, q: '', ev: null, lieux: false, quand: 'aujourdhui' };

  function readHash() {
    const [path, qs = ''] = location.hash.replace(/^#/, '').split('?');
    const p = new URLSearchParams(qs);
    const list = (k) => (p.get(k) || '').split(',').filter(Boolean);
    const [root, sub] = path.split('/');
    if (root === 'agenda' || root === 'carte') { state.view = root; state.tab = 'aujourdhui'; }
    else { state.view = 'liste'; state.tab = root === 'expos' ? 'expos' : (TABS[sub] || sub === 'jour') ? sub : 'aujourdhui'; } // legacy #expos
    state.day = state.tab === 'jour' && /^\d{4}-\d{2}-\d{2}$/.test(p.get('day') || '') ? p.get('day') : null;
    if (state.tab === 'jour' && !state.day) state.tab = 'aujourdhui';
    if (state.day === todayStr) { state.tab = 'aujourdhui'; state.day = null; }
    state.types = new Set(list('type').filter(t => typeOptions.includes(t)));
    state.areas = new Set(list('area').filter(a => areaOptions.some(o => o.slug === a)));
    state.venues = new Set(list('venue').filter(id => venueById[id])); // the legacy "fav" value is simply dropped
    state.free = p.get('free') === '1';
    state.special = p.get('special') === '1';
    state.q = state.view === 'liste' ? (p.get('q') || '') : '';
    state.month = /^\d{4}-\d{2}$/.test(p.get('m') || '') ? p.get('m') : currentMonth;
    state.ev = byUid.has(p.get('ev')) ? p.get('ev') : null;
    state.lieux = p.get('lieux') === '1';
    state.quand = ['semaine', 'tout'].includes(p.get('quand')) ? p.get('quand') : 'aujourdhui';
  }

  // `push` adds a history entry (view / tab / panel navigation); facet tweaks replace the current one.
  function writeHash(push = false) {
    const p = new URLSearchParams();
    if (state.types.size) p.set('type', [...state.types].join(','));
    if (state.areas.size) p.set('area', [...state.areas].join(','));
    if (state.venues.size) p.set('venue', [...state.venues].join(','));
    if (state.free) p.set('free', '1');
    if (state.special) p.set('special', '1');
    if (state.view === 'liste' && state.q) p.set('q', state.q);
    if (state.view === 'liste' && state.tab === 'jour') p.set('day', state.day);
    if (state.view === 'agenda' && state.month !== currentMonth) p.set('m', state.month);
    if (state.view === 'carte' && state.quand !== 'aujourdhui') p.set('quand', state.quand);
    if (state.ev) p.set('ev', state.ev);
    if (state.lieux) p.set('lieux', '1');
    const qs = p.toString().replace(/%2C/g, ',');
    const path = state.view === 'liste' ? `liste/${state.tab}` : state.view;
    const url = `${location.pathname}${location.search}#${path}${qs ? '?' + qs : ''}`;
    if (push) history.pushState(null, '', url); else history.replaceState(null, '', url);
  }

  const hasFilters = () => !!(state.types.size || state.areas.size || state.venues.size || state.free || state.special || (state.view === 'liste' && state.q));
  const level2Count = () => state.areas.size + state.venues.size + (state.free ? 1 : 0) + (state.special ? 1 : 0);
  const toggle = (set, v) => { set.has(v) ? set.delete(v) : set.add(v); };
  const commit = (push = false) => { writeHash(push); render(); };
  // Navigation (view, sub-tab, day): new history entry, scroll back to the top.
  const goto = (patch) => { Object.assign(state, patch); commit(true); $('main').scrollTop = 0; };

  // ---- Filtering --------------------------------------------------------------------------

  // AND between facets, OR inside a facet. Empty facet = no constraint. Search only exists in the Liste view.
  function applyFilters(list, s = state) {
    const q = s.view === 'liste' ? fold(s.q) : '';
    return list.filter(e =>
      (!s.types.size || s.types.has(e.category || 'autre')) &&
      (!s.areas.size || s.areas.has(venueArea[e.venue_id])) &&
      (!s.venues.size || s.venues.has(e.venue_id)) &&
      (!s.free || e.free === true) &&
      (!s.special || e._special) &&
      (!q || e._q.includes(q)));
  }
  // What the current view / sub-tab can actually display. Every count on the page is "what you would see".
  function scoped(list, s = state) {
    if (s.view === 'agenda') { const [ms, me] = monthBounds(s.month); return list.filter(e => !isLongRun(e) && covers(e, ms, me)); }
    if (s.tab === 'expos') return list.filter(e => isLongRun(e) && e.end_date >= todayStr);
    if (s.tab === 'tout') return list.filter(e => (e.end_date || e.start_date) >= todayStr);
    if (s.tab === 'semaine') { const w = weekWindow(); return list.filter(e => !isLongRun(e) && covers(e, w.from, w.to)); }
    const d = s.tab === 'jour' ? s.day : todayStr;
    return list.filter(e => !isLongRun(e) && covers(e, d, d));
  }
  const visible = (s = state) => scoped(applyFilters(events, s), s);
  // Live count of an option: all other facets as they are, this facet replaced by the option.
  const countWith = (patch) => visible({ ...state, ...patch }).length;

  // ---- Rendering helpers ------------------------------------------------------------------

  // Keep one child per key in `box` (created with make, refreshed with update) so focus survives re-renders.
  function syncNodes(box, keys, make, update) {
    const byKey = new Map([...box.children].map(n => [n.dataset.key, n]));
    for (const k of keys) {
      let n = byKey.get(k);
      if (!n) { n = make(k); n.dataset.key = k; box.appendChild(n); }
      update(n, k);
    }
    for (const [k, n] of byKey) if (!keys.includes(k)) n.remove();
  }
  function chipNode(cls, label, onClick, dot) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = `chip ${cls}`;
    b.innerHTML = `${dot ? '<span class="dot"></span>' : ''}${label}<span class="k"></span>`;
    b.onclick = onClick;
    return b;
  }
  function setChipState(b, on, count) {
    b.classList.toggle('on', on);
    b.classList.toggle('muted', !count);
    b.setAttribute('aria-pressed', on);
    b.querySelector('.k').textContent = count;
  }

  function renderTabs() {
    document.body.dataset.view = state.view;
    for (const t of document.querySelectorAll('#tabs .tab')) {
      const on = t.dataset.view === state.view;
      t.classList.toggle('on', on);
      t.setAttribute('aria-selected', on);
    }
  }

  function renderSubtabs() {
    syncNodes($('subtabs'), Object.keys(TABS),
      (k) => {
        const b = document.createElement('button');
        b.type = 'button'; b.setAttribute('role', 'tab');
        b.innerHTML = `${esc(TABS[k])}${k === 'expos' || k === 'tout' ? '<span class="count"></span>' : ''}`;
        b.onclick = () => goto({ tab: k, day: null });
        return b;
      },
      (b, k) => {
        const on = state.tab === k;
        b.classList.toggle('on', on);
        b.setAttribute('aria-selected', on);
        if (k === 'expos' || k === 'tout') b.querySelector('.count').textContent = countWith({ view: 'liste', tab: k });
      });
  }

  function renderTypes() {
    syncNodes($('types'), typeOptions,
      (k) => {
        const b = chipNode('type', esc(CATEGORIES[k] || k), () => { toggle(state.types, k); commit(); }, true);
        b.style.setProperty('--c', `var(--c-${k}, var(--c-autre))`);
        return b;
      },
      (b, k) => setChipState(b, state.types.has(k), countWith({ types: new Set([k]) })));
  }

  function optNode(label, onChange) {
    const l = document.createElement('label');
    l.className = 'opt';
    l.innerHTML = `<input type="checkbox"><span class="l">${label}</span><span class="k"></span>`;
    l.firstChild.onchange = onChange;
    return l;
  }
  function setOptState(l, on, count) {
    l.classList.toggle('on', on);
    l.classList.toggle('muted', !count);
    l.firstChild.checked = on;
    l.querySelector('.k').textContent = count;
  }

  function renderAreas() {
    syncNodes($('areaOpts'), areaOptions.map(a => a.slug),
      (k) => { const l = optNode(esc(areaName(k)), () => { toggle(state.areas, k); commit(); }); l.title = areaOptions.find(a => a.slug === k).full; return l; },
      (l, k) => setOptState(l, state.areas.has(k), countWith({ areas: new Set([k]) })));
  }

  function renderMore() {
    const MORE = {
      free: ['Gratuit', () => { state.free = !state.free; commit(); }, () => countWith({ free: true })],
      special: ['Séances spéciales', () => { state.special = !state.special; commit(); }, () => countWith({ special: true })],
    };
    syncNodes($('moreOpts'), Object.keys(MORE),
      (k) => optNode(esc(MORE[k][0]), MORE[k][1]),
      (l, k) => setOptState(l, state[k], MORE[k][2]()));
  }

  // Venue combobox: a text input narrowing the list below, arrow keys + Enter.
  let venueQuery = '', venueActive = -1;
  const visibleVenueRows = () => [...$('venueList').children].filter(n => !n.hidden);
  function venueRow(id) {
    const v = venueById[id];
    const li = document.createElement('li');
    li.className = 'vopt';
    li.id = `vopt-${id}`;
    li.setAttribute('role', 'option');
    li.style.setProperty('--c', `var(--c-${v.category || 'autre'}, var(--c-autre))`);
    li.innerHTML = `<span class="dot"></span><span class="name">${esc(v.name)}</span><span class="k"></span>`;
    li.onclick = () => { toggle(state.venues, id); commit(); if (!MOBILE.matches) $('venueQ').focus(); };
    return li;
  }
  function setVenueRowState(li, id) {
    const v = venueById[id], on = state.venues.has(id);
    const count = countWith({ venues: new Set([id]) });
    li.hidden = !!venueQuery && !fold(v.name).includes(venueQuery);
    li.classList.toggle('muted', !count);
    li.setAttribute('aria-selected', on);
    li.querySelector('.k').textContent = count;
  }
  function highlightVenue() {
    const rows = visibleVenueRows();
    if (venueActive >= rows.length) venueActive = rows.length - 1;
    rows.forEach((r, i) => r.classList.toggle('active', i === venueActive));
    const act = rows[venueActive];
    if (act) { $('venueQ').setAttribute('aria-activedescendant', act.id); act.scrollIntoView({ block: 'nearest' }); }
    else $('venueQ').removeAttribute('aria-activedescendant');
  }
  function renderVenues() {
    syncNodes($('venueList'), venueOptions.map(v => v.id), venueRow, setVenueRowState);
    highlightVenue();
    const sel = $('venueSel');
    sel.hidden = !state.venues.size;
    syncNodes(sel, [...state.venues],
      (id) => {
        const t = document.createElement('span');
        t.className = 'tag';
        t.innerHTML = `<span>${esc(venueById[id].name)}</span><span class="k"></span><button type="button" class="x" aria-label="Retirer ${esc(venueById[id].name)}">&times;</button>`;
        t.lastChild.onclick = () => { state.venues.delete(id); commit(); };
        return t;
      },
      (t, id) => { t.querySelector('.k').textContent = countWith({ venues: new Set([id]) }); });
  }
  $('venueQ').oninput = (ev) => { venueQuery = fold(ev.target.value); venueActive = venueQuery ? 0 : -1; renderVenues(); };
  $('venueQ').onkeydown = (ev) => {
    const rows = visibleVenueRows();
    if (ev.key === 'ArrowDown') { ev.preventDefault(); venueActive = Math.min(venueActive + 1, rows.length - 1); highlightVenue(); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); venueActive = Math.max(venueActive - 1, 0); highlightVenue(); }
    else if (ev.key === 'Enter') { ev.preventDefault(); const r = rows[venueActive]; if (r) { toggle(state.venues, r.dataset.key); commit(); } }
  };

  function renderRecap() {
    const tags = [];
    for (const t of state.types) tags.push([CATEGORIES[t] || t, () => state.types.delete(t)]);
    for (const a of state.areas) tags.push([areaName(a), () => state.areas.delete(a)]);
    for (const id of state.venues) tags.push([venueById[id].name, () => state.venues.delete(id)]);
    if (state.free) tags.push(['Gratuit', () => { state.free = false; }]);
    if (state.special) tags.push(['Séances spéciales', () => { state.special = false; }]);
    if (state.view === 'liste' && state.q) tags.push([`« ${state.q} »`, () => { state.q = ''; $('q').value = ''; }]);
    const box = $('recap');
    box.hidden = !tags.length;
    box.innerHTML = '';
    if (!tags.length) return;
    const lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = 'Filtres :'; box.appendChild(lbl);
    for (const [label, remove] of tags) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tag';
      b.setAttribute('aria-label', `Retirer le filtre ${label}`);
      b.innerHTML = `<span>${esc(label)}</span><span class="x" aria-hidden="true">&times;</span>`;
      b.onclick = () => { remove(); commit(); };
      box.appendChild(b);
    }
    const clear = document.createElement('button'); clear.type = 'button'; clear.className = 'lnk clear'; clear.textContent = 'Tout effacer'; clear.onclick = clearAll; box.appendChild(clear);
  }

  function clearAll() {
    state.types.clear(); state.areas.clear(); state.venues.clear();
    state.free = state.special = false; state.q = '';
    $('q').value = ''; $('venueQ').value = ''; venueQuery = ''; venueActive = -1;
    commit();
  }

  function renderFiltersBtn() {
    const n = level2Count();
    $('fcount').textContent = n;
    $('filtersBtn').classList.toggle('on', n > 0);
    const shown = visible().length;
    $('sheetApply').textContent = shown ? `Voir ${plural(shown, 'événement')}` : 'Aucun événement';
  }

  // ---- Visuals and the card component ----------------------------------------------------

  // Visuals are published as paths relative to the site directory (img/<uid>.webp), so resolve against the page URL.
  const imageUrl = (e) => e.image ? new URL(e.image, location.href).href : null;
  function placeholderNode(cls) {
    const d = document.createElement('div');
    d.className = `vis ph ${cls}`;
    d.innerHTML = '<span>pas de visuel</span>';
    return d;
  }
  // Lazy <img> in a tinted box. A missing file swaps to the placeholder (or removes the box when `optional`);
  // events without a visual get the placeholder, or nothing when `optional`.
  function visualNode(e, cls, optional = false) {
    const url = imageUrl(e);
    if (!url) return optional ? null : placeholderNode(cls);
    const wrap = document.createElement('div');
    wrap.className = `vis ${cls}`;
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.decoding = 'async';
    img.alt = e.title;
    img.onerror = () => { optional ? wrap.remove() : wrap.replaceWith(placeholderNode(cls)); };
    img.src = url;
    wrap.appendChild(img);
    return wrap;
  }

  // "termine dans N jours" / "commence le ..." hint for a long run, relative to today.
  function runHint(e) {
    const toStart = dayDiff(todayStr, e.start_date), toEnd = dayDiff(todayStr, e.end_date);
    if (toStart > 0) return { text: toStart === 1 ? 'commence demain' : `commence le ${fmtDate(e.start_date)} (dans ${toStart} jours)`, cls: 'upcoming' };
    if (toEnd === 0) return { text: "dernier jour aujourd'hui", cls: 'soon' };
    if (toEnd === 1) return { text: 'termine demain', cls: 'soon' };
    return { text: `termine dans ${toEnd} jours`, cls: toEnd <= LONG_RUN_DAYS ? 'soon' : '' };
  }

  // Date / time line of a card. Exhibitions show their range; day cards show the time, then the event type or "gratuit";
  // "Tout" cards span every date, so they lead with the day (or the range).
  function cardWhen(e, ctx) {
    if (ctx === 'expos') return fmtRange(e);
    const bits = [];
    if (ctx === 'tout') bits.push(isRange(e) ? fmtRange(e) : cap(fmtDayShort.format(dateOf(e.start_date))));
    if (hasTime(e)) bits.push(timeLabel(e));
    if (isRange(e) && ctx !== 'tout') bits.push(`jusqu'au ${fmtDate(e.end_date)}`);
    const extra = e.event_type || (e.free === true ? 'gratuit' : null);
    if (extra) bits.push(extra);
    return bits.join(' · ');
  }

  // The single card component, used by every Liste sub-tab and by the mobile agenda.
  function cardNode(e, ctx) {
    const n = document.createElement('article');
    n.className = 'card' + (e.status === 'cancelled' ? ' cancelled' : '');
    n.style.setProperty('--c', color(e));
    const when = cardWhen(e, ctx);
    const hint = ctx === 'expos' || (ctx === 'tout' && isLongRun(e)) ? runHint(e) : (STATUS[e.status] ? { text: STATUS[e.status], cls: 'soon' } : null);
    n.innerHTML = `<div class="body">
      <div class="venue"><span class="pin"></span>${esc(e.venue_name)}</div>
      <div class="title">${esc(e.title)}</div>
      ${when ? `<div class="dates">${esc(when)}</div>` : ''}
      ${hint ? `<div class="hintline ${hint.cls}">${esc(hint.text)}</div>` : ''}
      ${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(new URL(e.url).hostname)}</a>` : ''}</div>`;
    n.prepend(visualNode(e, 'banner'));
    return opener(n, e, (ev) => !ev.target.closest('a'));
  }
  // Make a node open the modal on click / Enter / Space; `data-uid` also drives navigation order and focus return.
  function opener(n, e, allow = () => true) {
    n.dataset.uid = e.uid;
    n.tabIndex = 0;
    n.setAttribute('role', 'button');
    n.onclick = (ev) => { if (allow(ev)) openModal(e); };
    n.onkeydown = (ev) => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target === n) { ev.preventDefault(); openModal(e); } };
    return n;
  }
  function cardsGrid(list, ctx) {
    const g = document.createElement('div');
    g.className = 'cards';
    for (const e of list) g.appendChild(cardNode(e, ctx));
    return g;
  }
  function groupHeading(text) { const h = document.createElement('h3'); h.className = 'group'; h.textContent = text; return h; }

  // ---- Liste view -------------------------------------------------------------------------

  function renderListe() {
    const evs = visible();
    const lead = $('listLead'), body = $('listBody'), more = $('listMore');
    body.innerHTML = '';
    more.innerHTML = '';
    more.hidden = true;
    if (state.tab === 'expos') renderExposTab(evs, lead, body);
    else if (state.tab === 'tout') renderAllTab(evs, lead, body);
    else if (state.tab === 'semaine') renderWeekTab(evs, lead, body);
    else renderDayTab(evs, state.tab === 'jour' ? state.day : todayStr, lead, body);
    if (state.tab !== 'expos' && state.tab !== 'tout') renderMoreExpos(more);
    if (state.tab !== 'tout' && state.q) renderSearchAll(more, evs.length);
  }

  // Everything still ahead, exhibitions included, by month; a run already open is filed under today.
  function renderAllTab(evs, lead, body) {
    const from = (e) => e.start_date < todayStr ? todayStr : e.start_date;
    const sorted = [...evs].sort((a, b) => from(a).localeCompare(from(b)) || byTime(a, b) || a.title.localeCompare(b.title));
    lead.textContent = `${evs.length ? plural(evs.length, 'événement') : 'Aucun événement'} à venir${state.q ? ` pour « ${state.q} »` : ''}`;
    if (!evs.length) { body.innerHTML = `<div class="empty"><p>${state.q ? 'Rien ne correspond à cette recherche' : 'Rien à venir'} dans ces lieux.</p></div>`; return; }
    const byMonth = {};
    for (const e of sorted) (byMonth[from(e).slice(0, 7)] ||= []).push(e);
    for (const [m, list] of Object.entries(byMonth)) {
      body.appendChild(groupHeading(`${cap(fmtMonth.format(dateOf(m + '-01')))} (${list.length})`));
      body.appendChild(cardsGrid(list, 'tout'));
    }
  }

  // Day / week / exhibitions only search their own period: point to the matches further ahead.
  function renderSearchAll(more, shown) {
    const n = countWith({ view: 'liste', tab: 'tout' });
    if (n <= shown) return;
    more.hidden = false;
    const p = document.createElement('p');
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'lnk';
    b.textContent = `« ${state.q} » dans tout l'agenda : ${plural(n, 'événement')}`;
    b.onclick = () => goto({ tab: 'tout', day: null });
    p.appendChild(b);
    more.appendChild(p);
  }

  function renderDayTab(evs, day, lead, body) {
    lead.textContent = `${cap(fmtDay.format(dateOf(day)))}, ${evs.length ? plural(evs.length, 'événement') : 'aucun événement'}`;
    body.appendChild(evs.length ? cardsGrid([...evs].sort(byTime), 'day') : emptyDay(day));
  }

  // Empty day: say so, point to the next event in these venues, offer the week.
  function emptyDay(day) {
    const box = document.createElement('div');
    box.className = 'empty';
    const next = applyFilters(events).filter(e => !isLongRun(e) && e.start_date > day).sort((a, b) => a.start_date.localeCompare(b.start_date) || byTime(a, b))[0];
    let html = `<p>${day === todayStr ? "Rien aujourd'hui" : 'Rien ce jour-là'} dans ces lieux.</p>`;
    if (next) {
      const rel = dayDiff(day, next.start_date) === 1 ? 'demain' : fmtDay.format(dateOf(next.start_date));
      html += `<p>Prochain event : ${esc(rel)}, <button type="button" class="lnk" id="nextEv">${esc(next.title)}</button>${hasTime(next) ? ` (${timeLabel(next)})` : ''}</p>`;
    }
    html += '<p><button type="button" id="goWeek">Voir cette semaine</button></p>';
    box.innerHTML = html;
    box.querySelector('#goWeek').onclick = () => goto({ tab: 'semaine', day: null });
    if (next) opener(box.querySelector('#nextEv'), next);
    return box;
  }

  function renderWeekTab(evs, lead, body) {
    const w = weekWindow(), from = dateOf(w.from), to = dateOf(w.to);
    const range = from.getMonth() === to.getMonth() ? `du ${from.getDate()} au ${to.getDate()} ${fmtMonthLong.format(to)}` : `du ${fmtDate(w.from)} au ${fmtDate(w.to)}`;
    lead.textContent = `${evs.length ? plural(evs.length, 'événement') : 'Aucun événement'} ${range}`;
    // Short ranges appear once, on their first day inside the window.
    const byDay = {};
    for (const e of evs) (byDay[e.start_date < w.from ? w.from : e.start_date] ||= []).push(e);
    const days = Object.keys(byDay).sort();
    if (!days.length) { body.innerHTML = '<div class="empty"><p>Rien cette semaine dans ces lieux.</p></div>'; return; }
    for (const k of days) {
      body.appendChild(groupHeading(cap(fmtDayNum.format(dateOf(k)))));
      body.appendChild(cardsGrid(byDay[k].sort(byTime), 'day'));
    }
  }

  function renderExposTab(evs, lead, body) {
    const running = evs.filter(e => e.start_date <= todayStr).sort((a, b) => a.end_date.localeCompare(b.end_date) || a.start_date.localeCompare(b.start_date) || a.title.localeCompare(b.title));
    const upcoming = evs.filter(e => e.start_date > todayStr).sort((a, b) => a.start_date.localeCompare(b.start_date) || a.title.localeCompare(b.title));
    lead.textContent = evs.length ? `${plural(evs.length, 'exposition')} et événements au long cours` : 'Aucune exposition';
    if (!evs.length) { body.innerHTML = '<div class="empty"><p>Aucune exposition en cours ni à venir dans ces lieux.</p></div>'; return; }
    if (running.length) { body.appendChild(groupHeading(`En cours (${running.length})`)); body.appendChild(cardsGrid(running, 'expos')); }
    if (upcoming.length) { body.appendChild(groupHeading(`À venir (${upcoming.length})`)); body.appendChild(cardsGrid(upcoming, 'expos')); }
  }

  // Discreet link to the exhibitions, under the day / week lists.
  function renderMoreExpos(more) {
    const all = applyFilters(events);
    const running = all.filter(e => isLongRun(e) && e.start_date <= todayStr && e.end_date >= todayStr).length;
    const upcoming = all.filter(e => isLongRun(e) && e.start_date > todayStr).length;
    const n = running || upcoming;
    if (!n) return;
    more.hidden = false;
    more.innerHTML = '';
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'lnk';
    b.textContent = `+ ${plural(n, 'exposition')} ${running ? 'en cours' : 'à venir'}`;
    b.onclick = () => goto({ tab: 'expos', day: null });
    more.appendChild(b);
  }

  // ---- Agenda view: month grid (desktop) and mini-month (mobile) -------------------------

  function evNode(e, row) {
    const n = document.createElement('div');
    n.className = 'ev' + (e.status === 'cancelled' ? ' cancelled' : '');
    n.style.setProperty('--c', color(e));
    n.style.gridRow = row + 1;
    n.title = `${e.venue_name} - ${e.title}`;
    const t = timeLabel(e);
    n.innerHTML = `<span class="pin"></span>${t ? `<span class="t">${esc(t)}</span>` : ''}<span class="n">${esc(e.title)}</span>`;
    return opener(n, e);
  }
  // "+N" chip in the last slot of an overflowing day: opens that day in the Liste view.
  function moreNode(dayKey, n, row) {
    const c = document.createElement('button');
    c.type = 'button';
    c.className = 'ev more';
    c.style.gridRow = row + 1;
    c.textContent = `+${n}`;
    c.setAttribute('aria-label', `${n} événements de plus le ${fmtDate(dayKey)}`);
    c.onclick = () => gotoDay(dayKey);
    return c;
  }
  const gotoDay = (k) => goto(k === todayStr ? { view: 'liste', tab: 'aujourdhui', day: null } : { view: 'liste', tab: 'jour', day: k });

  // One segment of a multi-day bar inside a week row: columns c0..c1 (0 = Monday), stacked at `row`.
  function barNode(e, row, c0, c1, isStart, isEnd) {
    const n = document.createElement('div');
    n.className = 'bar' + (isStart ? ' s' : '') + (isEnd ? ' e' : '') + (e.status === 'cancelled' ? ' cancelled' : '') + (e.end_date < todayStr ? ' past' : '');
    n.style.setProperty('--c', color(e));
    n.style.setProperty('--row', row);
    n.style.setProperty('--c0', c0);
    n.style.setProperty('--span', c1 - c0 + 1);
    n.title = `${e.venue_name} - ${e.title} (${fmtRange(e)})`;
    // The title is repeated on every segment; only the start segment carries the dot, continuations render it muted.
    n.innerHTML = `${isStart ? '<span class="pin"></span>' : ''}<span class="n">${esc(e.title)}</span>`;
    return opener(n, e);
  }

  // Greedy row assignment for the bars of one week: first row whose columns are free. Returns the placements
  // and the occupancy matrix (rows x 7 columns) the single events then fill around.
  function layoutBars(bars, weekStartKey, weekEndKey) {
    const rows = [], placed = [];
    const sorted = [...bars].sort((a, b) => a.start_date.localeCompare(b.start_date) || spanDays(b) - spanDays(a) || byTime(a, b));
    for (const e of sorted) {
      const c0 = e.start_date < weekStartKey ? 0 : dayDiff(weekStartKey, e.start_date);
      const c1 = e.end_date > weekEndKey ? 6 : dayDiff(weekStartKey, e.end_date);
      let r = rows.findIndex(row => !row.slice(c0, c1 + 1).some(Boolean));
      if (r < 0) { r = rows.length; rows.push(Array(7).fill(false)); }
      for (let c = c0; c <= c1; c++) rows[r][c] = true;
      placed.push({ e, r, c0, c1 });
    }
    return { rows, placed };
  }

  // Month grid with a per-week slot model: bars take their rows first, then each day's events fill the free
  // slots of their column from the top. Slot count follows the available height; overflow becomes a "+N" chip.
  function renderGrid(evs) {
    const cursor = dateOf(state.month + '-01');
    const y = cursor.getFullYear(), m = cursor.getMonth();
    const first = new Date(y, m, 1);
    const start = addDays(first, -((first.getDay() + 6) % 7));
    const weeks = Math.ceil((((first.getDay() + 6) % 7) + new Date(y, m + 1, 0).getDate()) / 7);
    const grid = $('grid');
    grid.innerHTML = `<div class="dows">${DOW.map(d => `<div class="dow">${d}</div>`).join('')}</div>`;
    const weekH = Math.max(0, (grid.clientHeight - 28) / weeks);
    const SLOTS = Math.max(2, Math.floor((weekH - 27) / SLOT_H));
    grid.style.setProperty('--slots', SLOTS);
    const byDay = {};
    for (const e of evs.filter(e => !isRange(e))) (byDay[e.start_date] ||= []).push(e);
    const bars = evs.filter(isRange);

    for (let w = 0; w < weeks; w++) {
      const ws = addDays(start, w * 7), wsKey = iso(ws), weKey = iso(addDays(ws, 6));
      const week = document.createElement('div');
      week.className = 'week';
      const { rows, placed } = layoutBars(bars.filter(e => covers(e, wsKey, weKey)), wsKey, weKey);
      // Bars beyond the penultimate slot are not drawn: the last slot stays free for events or the "+N" chip.
      const drawn = placed.filter(b => b.r <= SLOTS - 2);
      for (let i = 0; i < 7; i++) {
        const d = addDays(ws, i), k = iso(d);
        const cell = document.createElement('div');
        cell.className = 'cell' + (d.getMonth() !== m ? ' out' : '') + (k === todayStr ? ' today' : '') + (k < todayStr ? ' past' : '') + (i >= 5 ? ' we' : '');
        cell.innerHTML = `<div class="d"><span>${d.getDate()}</span></div><div class="slots"></div>`;
        const slots = cell.lastChild;
        const list = (byDay[k] || []).sort(byTime);
        const covering = placed.filter(b => b.c0 <= i && i <= b.c1).length;
        const shownBars = drawn.filter(b => b.c0 <= i && i <= b.c1).length;
        const total = covering + list.length;
        const overflow = total > SLOTS || shownBars < covering;
        const limit = overflow ? SLOTS - 1 : SLOTS;
        let r = 0, shown = 0;
        for (const e of list) {
          while (r < limit && rows[r] && rows[r][i]) r++;
          if (r >= limit) break;
          slots.appendChild(evNode(e, r));
          r++; shown++;
        }
        if (overflow) slots.appendChild(moreNode(k, total - shownBars - shown, SLOTS - 1));
        week.appendChild(cell);
      }
      for (const b of drawn) week.appendChild(barNode(b.e, b.r, b.c0, b.c1, b.e.start_date >= wsKey, b.e.end_date <= weKey));
      grid.appendChild(week);
    }
  }

  // Mobile: 7-column mini-month with up to three category dots per day, then the selected day's cards.
  let miniDay = null;
  function renderMini(evs) {
    const cursor = dateOf(state.month + '-01');
    const y = cursor.getFullYear(), m = cursor.getMonth();
    const first = new Date(y, m, 1);
    const start = addDays(first, -((first.getDay() + 6) % 7));
    const weeks = Math.ceil((((first.getDay() + 6) % 7) + new Date(y, m + 1, 0).getDate()) / 7);
    const [ms, me] = monthBounds(state.month);
    const dayItems = (k) => evs.filter(e => covers(e, k, k)).sort(byTime);
    if (!miniDay || miniDay.slice(0, 7) !== state.month) {
      let firstWith = null;
      for (let d = dateOf(ms); iso(d) <= me && !firstWith; d = addDays(d, 1)) if (dayItems(iso(d)).length) firstWith = iso(d);
      miniDay = state.month === currentMonth ? todayStr : (firstWith || ms);
    }
    const mini = $('mini');
    mini.innerHTML = DOW.map(d => `<div class="dow" role="columnheader">${d}</div>`).join('');
    for (let w = 0; w < weeks; w++) for (let i = 0; i < 7; i++) {
      const d = addDays(start, w * 7 + i), k = iso(d);
      const items = dayItems(k);
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'mday' + (d.getMonth() !== m ? ' out' : '') + (k === todayStr ? ' today' : '') + (k < todayStr ? ' past' : '') + (k === miniDay ? ' on' : '');
      b.setAttribute('aria-label', `${fmtDay.format(d)}, ${plural(items.length, 'événement')}`);
      b.setAttribute('aria-pressed', k === miniDay);
      b.innerHTML = `<span class="num">${d.getDate()}</span><span class="dots">${items.slice(0, 3).map(e => `<i style="--c:${color(e)}"></i>`).join('')}${items.length > 3 ? '<span class="plus">+</span>' : ''}</span>`;
      b.onclick = () => { miniDay = k; renderMini(evs); };
      mini.appendChild(b);
    }
    const items = dayItems(miniDay);
    $('miniLead').textContent = `${cap(fmtDayShort.format(dateOf(miniDay)))}, ${items.length ? plural(items.length, 'événement') : 'aucun événement'}`;
    const cards = $('miniCards');
    cards.innerHTML = '';
    for (const e of items) cards.appendChild(cardNode(e, 'day'));
  }

  function renderAgenda() {
    $('month').textContent = fmtMonth.format(dateOf(state.month + '-01'));
    const evs = visible();
    if (MOBILE.matches) renderMini(evs); else renderGrid(evs);
  }

  function render() {
    renderTabs();
    renderSubtabs(); renderTypes(); renderAreas(); renderVenues(); renderMore(); renderRecap(); renderFiltersBtn();
    if (state.view === 'liste') renderListe(); else if (state.view === 'agenda') renderAgenda(); else renderCarte();
    if (state.lieux) renderLieux();
    syncPanels();
  }

  // ---- Filters popover / bottom sheet -----------------------------------------------------

  const pop = $('pop'), filtersBtn = $('filtersBtn');
  function openPop() {
    pop.hidden = false;
    $('backdrop').hidden = false;
    filtersBtn.setAttribute('aria-expanded', 'true');
    (MOBILE.matches ? $('popClose') : pop).focus();
  }
  function closePop(refocus = true) {
    if (pop.hidden) return;
    pop.hidden = true;
    $('backdrop').hidden = true;
    filtersBtn.setAttribute('aria-expanded', 'false');
    if (refocus) filtersBtn.focus();
  }
  filtersBtn.onclick = () => pop.hidden ? openPop() : closePop();
  $('popClose').onclick = () => closePop();
  $('sheetApply').onclick = () => closePop();
  $('clearAll').onclick = clearAll;

  // Info popover (freshness, credits, exports).
  const infoPop = $('infoPop'), infoBtn = $('infoBtn');
  function setInfo(open) { infoPop.hidden = !open; infoBtn.setAttribute('aria-expanded', open); }
  infoBtn.onclick = () => setInfo(infoPop.hidden);

  document.addEventListener('pointerdown', (ev) => {
    if (!pop.hidden && !pop.contains(ev.target) && !filtersBtn.contains(ev.target)) closePop(false);
    if (!infoPop.hidden && !infoPop.contains(ev.target) && !infoBtn.contains(ev.target)) setInfo(false);
  });

  // ---- Event modal ------------------------------------------------------------------------

  // Same place written twice (venue vs. location, "[mac] Musée" vs "Musée [mac]") collapses to one line.
  const placeKey = (s) => fold(s).replace(/\[[^\]]*\]/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim();
  function whereLine(e, v) {
    const seen = new Set([placeKey(e.venue_name)]), parts = [];
    for (const s of [e.location_name, v.map_name]) {
      if (!s) continue;
      const k = placeKey(s);
      if (seen.has(k)) continue;
      seen.add(k); parts.push(s);
    }
    return parts.length ? parts.join(' - ') : e.venue_name;
  }
  // Exhibitions: dates only. Short ranges: dates plus hours when a real start time exists. Single days: day and time.
  function whenLine(e) {
    const t = timeLabel(e), end = e.end_time && e.end_time.slice(0, 5) !== '00:00' ? hhmm(e.end_time) : '';
    if (isLongRun(e)) return fmtRange(e);
    if (isRange(e)) return `${fmtRange(e)}${t ? `, ${t}${end ? ' - ' + end : ''}` : ''}`;
    return `${fmtDay.format(dateOf(e.start_date))}${t ? ` à ${t}` : ''}${end ? ` (jusqu'à ${end})` : ''}`;
  }

  // Fill the modal body with one event.
  function renderModalBody(e) {
    const v = venueById[e.venue_id] || {};
    const rows = [
      ['Quand', esc(whenLine(e))],
      ['Où', esc(whereLine(e, v))],
      e.event_type ? ['Type', esc(e.event_type)] : null,
      e.price ? ['Prix', esc(e.price)] : null,
      STATUS[e.status] ? ['Statut', STATUS[e.status]] : null,
      e.url ? ['Lien', `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(new URL(e.url).hostname)}</a>`] : null,
    ].filter(Boolean);
    const map = v.lat ? `<a href="https://tfrere.github.io/marseille-tes-lieux/#${encodeURIComponent(v.map_name || v.name)}" target="_blank" rel="noopener">voir sur la carte</a>` : '';
    const seen = e.last_seen ? ` · vu le ${new Date(e.last_seen).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' })}` : '';
    const kind = { instagram: '<span class="badge">Instagram</span>', facebook: '<span class="badge">Facebook</span>' }[e.source_kind] || '';
    const body = $('modalBody');
    body.innerHTML = `
      ${e.image && e.image_source ? `<a class="orig" href="${esc(e.image_source)}" target="_blank" rel="noopener">visuel d'origine</a>` : ''}
      <div class="venue" style="--c:${color(e)}"><span class="pin"></span>${esc(e.venue_name)}</div>
      <h2>${esc(e.title)}</h2>
      ${e.summary ? `<p>${esc(e.summary)}</p>` : ''}
      <dl>${rows.map(([k, val]) => `<dt>${k}</dt><dd>${val}</dd>`).join('')}</dl>
      ${map}
      <div class="src">Source : <a href="${esc(e.source_url)}" target="_blank" rel="noopener">${esc(new URL(e.source_url).hostname)}</a>${seen}
        <details><summary>détails de la vérification</summary>
          <p>${kind}${e.verifier ? '<span class="badge">vérifié</span>' : '<span class="badge">données structurées</span>'}</p>
          ${e.evidence && e.evidence.length ? `<blockquote>${esc(e.evidence[0])}</blockquote>` : ''}
          ${e.verifier_reason ? `<p>${esc(e.verifier_reason)}</p>` : ''}
        </details>
      </div>`;
    const vis = visualNode(e, 'poster', true);
    if (vis) { vis.style.setProperty('--c', color(e)); body.prepend(vis); }
    body.scrollTop = 0;
  }

  // Navigation order = what is displayed: Liste cards in DOM order, mobile agenda = the selected day's cards,
  // desktop agenda = the month's events by date and time (bars once).
  function modalSequence() {
    if (state.view === 'liste') return [...document.querySelectorAll('#listBody .card')].map(n => byUid.get(n.dataset.uid));
    if (state.view === 'carte') return carteSeq;
    if (MOBILE.matches) return [...document.querySelectorAll('#miniCards .card')].map(n => byUid.get(n.dataset.uid));
    return visible().sort((a, b) => a.start_date.localeCompare(b.start_date) || byTime(a, b));
  }
  const modal = $('modal'), mbox = modal.querySelector('.mbox');
  let modalSeq = [], modalIdx = -1, modalUid = null, modalOpenerUid = null;
  function showModalAt(idx, push) {
    const e = modalSeq[idx];
    modalIdx = idx;
    modalUid = e.uid;
    renderModalBody(e);
    $('modalPos').textContent = modalSeq.length > 1 ? `${idx + 1} / ${modalSeq.length}` : '';
    $('modalPrev').disabled = idx <= 0;
    $('modalNext').disabled = idx >= modalSeq.length - 1;
    if (state.ev !== e.uid) { state.ev = e.uid; writeHash(push); }
  }
  // Opening pushes a history entry; moving inside the modal replaces it, so Back closes the modal.
  function openModal(e, push = true) {
    if (modal.hidden) modalOpenerUid = e.uid;
    modalSeq = modalSequence();
    let idx = modalSeq.findIndex(x => x.uid === e.uid);
    if (idx < 0) { modalSeq = [e]; idx = 0; }
    modal.hidden = false;
    showModalAt(idx, push);
    mbox.focus({ preventScroll: true });
  }
  function stepModal(n) {
    const idx = modalIdx + n;
    if (idx < 0 || idx >= modalSeq.length) return;
    showModalAt(idx, false);
  }
  function closeModal(write = true) {
    if (modal.hidden) return;
    modal.hidden = true;
    modalUid = null;
    if (state.ev) { state.ev = null; if (write) writeHash(); }
    // Focus goes back to the card / chip that opened the modal (re-rendered nodes are found again by uid).
    const opener = document.querySelector(`[data-uid="${modalOpenerUid}"]`);
    if (opener) opener.focus({ preventScroll: true });
  }
  $('modalClose').onclick = () => closeModal();
  $('modalPrev').onclick = () => stepModal(-1);
  $('modalNext').onclick = () => stepModal(1);
  modal.addEventListener('pointerdown', (ev) => { if (ev.target === modal) closeModal(); });
  // Focus trap: Tab cycles inside the dialog.
  modal.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Tab') return;
    const items = [...modal.querySelectorAll('button:not(:disabled), a[href], summary, [tabindex="0"]')].filter(n => n.offsetParent !== null);
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (ev.shiftKey && (document.activeElement === first || document.activeElement === mbox)) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  });
  // Touch swipe (mobile): horizontal move over ~50 px steps to the previous / next event.
  let swipe = null;

  const mapVenues = venues.filter(v => v.lat != null && v.lng != null);
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  // Period tabs. Today and this week leave exhibitions out (as the Liste sub-tabs do); "Tout" is everything upcoming.

  const CARTE_EMPTY = { aujourdhui: "aujourd'hui", semaine: 'cette semaine', tout: 'à venir' };
  const fmtWeekday = new Intl.DateTimeFormat('fr-FR', { weekday: 'short' });
  // A single-day event of today is over once its end time (or start + 2 h) is behind us. Only when the data is

  function overAlready(e) {
    if (todayStr !== iso(new Date()) || isRange(e) || !hasTime(e) || e.start_date !== todayStr) return false;
    const end = e.end_time && e.end_time.slice(0, 5) !== '00:00' ? e.end_time : null;

  const fmtKm = (km) => `${km.toLocaleString('fr-FR', { maximumFractionDigits: 1 })} km`;
  const fmtM = (m) => `${Math.round(m)} m`;
  const metres = (a, b) => Math.hypot((b[0] - a[0]) * LNG_SCALE, b[1] - a[1]) * 111320; // [lng, lat] pairs
  let bike = {}, bikeState = 'idle'; // venue id -> { go, back, km }; idle | loading | ok | error
  let maplibreP = null, cmap = null, carteSeq = [], selected = null, is3D = false, homeEl = null;

  function loadMaplibre() {

  // ---- Bike times

  function bikeMins(distM, upM, downM) {
    const flat = distM / 1000 / BIKE_KMH * 3600;
    const sec = flat + upM * 5 - Math.min(flat * 0.1, downM);
    return Math.max(1, Math.round(Math.max(60, sec) / 60));
  }
  async function fetchJson(u) {
    const r = await fetch(u);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }
  const bikeKey = (v) => `${HOME.lat},${HOME.lng}>${v.lat},${v.lng}`;
  function readBikeCache() { try { return JSON.parse(localStorage.getItem(BIKE_CACHE_KEY)) || {}; } catch (e) { return {}; } }
  function writeBikeCache(cache) { try { localStorage.setItem(BIKE_CACHE_KEY, JSON.stringify(cache)); } catch (e) { /* ignore */ } }

  // List estimate: one table request each way and one altitude request for every venue, climb counted between
  // the two endpoints only. Replaced by the along-the-route figures once a venue's route has been drawn.
  async function computeBike() {
    const cache = readBikeCache();
    const missing = mapVenues.filter(v => !cache[bikeKey(v)]?.elev);
    if (missing.length) {
      const pts = [HOME, ...missing];
      const base = `${BIKE_ROUTER}/table/v1/driving/${pts.map(p => `${p.lng},${p.lat}`).join(';')}?annotations=distance`;
      const [go, back, alt] = await Promise.all([
        fetchJson(`${base}&sources=0`),
        fetchJson(`${base}&destinations=0`),
        fetchJson(`${ELEVATION}?latitude=${pts.map(p => p.lat).join(',')}&longitude=${pts.map(p => p.lng).join(',')}`).catch(() => null),
      ]);
      if (go.code !== 'Ok' || back.code !== 'Ok') throw new Error(go.code || back.code);
      missing.forEach((v, i) => {
        const dGo = go.distances[0][i + 1], dBack = back.distances[i + 1][0];
        if (dGo == null || dBack == null) return;
        const dz = alt ? alt.elevation[i + 1] - alt.elevation[0] : 0;
        cache[bikeKey(v)] = { go: bikeMins(dGo, Math.max(0, dz), Math.max(0, -dz)), back: bikeMins(dBack, Math.max(0, -dz), Math.max(0, dz)), km: dGo / 1000, elev: !!alt };
      });
      writeBikeCache(cache);
    }
    return Object.fromEntries(mapVenues.filter(v => cache[bikeKey(v)]).map(v => [v.id, cache[bikeKey(v)]]));
  }

  // ---- Routes: geometry both ways + altitude profile along each

  // Evenly spaced points along a polyline, each as [lng, lat, metres from start].
  function sampleLine(coords, n) {
    const cum = [0];
    for (let i = 1; i < coords.length; i++) cum.push(cum[i - 1] + metres(coords[i - 1], coords[i]));
    const total = cum[cum.length - 1], out = [];
    for (let k = 0, j = 0; k < n; k++) {
      const target = total * k / (n - 1);
      while (j < cum.length - 2 && cum[j + 1] < target) j++;
      const seg = cum[j + 1] - cum[j], t = seg > 0 ? Math.min(1, (target - cum[j]) / seg) : 0;
      const a = coords[j], b = coords[Math.min(j + 1, coords.length - 1)];
      out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, target]);
    }
    return out;
  }
  // Climb and descent with light smoothing and a 2 m threshold against DEM noise (same as marseille-tes-lieux).
  function climb(elevs) {
    const s = elevs.map((e, i, a) => (i === 0 || i === a.length - 1) ? e : (a[i - 1] + e + a[i + 1]) / 3);
    let up = 0, down = 0;
    for (let i = 1; i < s.length; i++) { const d = s[i] - s[i - 1]; if (d > 2) up += d; else if (d < -2) down -= d; }
    return { up, down };
  }
  function fetchRoute(id) {
    routes[id] ||= (async () => {
      const v = venueById[id];
      const leg = async (a, b) => {
        const r = await fetchJson(`${BIKE_ROUTER}/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`);
        if (r.code !== 'Ok' || !r.routes?.length) throw new Error(r.code || 'no route');
        return r.routes[0];
      };
      const [go, back] = await Promise.all([leg(HOME, v), leg(v, HOME)]);
      const sGo = sampleLine(go.geometry.coordinates, PROFILE_POINTS), sBack = sampleLine(back.geometry.coordinates, PROFILE_POINTS);
      const pts = [...sGo, ...sBack];
      let elev = null;
      try {
        elev = (await fetchJson(`${ELEVATION}?latitude=${pts.map(p => p[1].toFixed(5)).join(',')}&longitude=${pts.map(p => p[0].toFixed(5)).join(',')}`)).elevation;
      } catch (e) { /* flat estimate */ }
      const summary = (r, samples, el) => {
        const c = el ? climb(el) : { up: 0, down: 0 };
        return { km: r.distance / 1000, mins: bikeMins(r.distance, c.up, c.down), up: c.up, down: c.down, profile: el ? samples.map((p, i) => [p[2], el[i]]) : null };
      };
      return {
        coords: go.geometry.coordinates,
        go: summary(go, sGo, elev && elev.slice(0, PROFILE_POINTS)),
        back: summary(back, sBack, elev && elev.slice(PROFILE_POINTS)),

    })().catch((e) => { delete routes[id]; throw e; });
    return routes[id];
  }

  function profileSvg(profile) {
    const W = 240, H = 36, total = profile[profile.length - 1][0] || 1;

  // fitBounds fits the flat footprint and only then tilts, which pushes the near side off-screen. Fit the
  // projected points instead: a few center/zoom corrections converge under perspective.
  function cameraFor(points, pad, maxZoom = 16) {
    const start = { center: cmap.getCenter(), zoom: cmap.getZoom() };
    const box = cmap.getContainer(), W = box.clientWidth, H = box.clientHeight;
    const aw = Math.max(80, W - pad.left - pad.right), ah = Math.max(80, H - pad.top - pad.bottom);
    for (let i = 0; i < 10; i++) {
      const px = points.map(p => cmap.project(p)), xs = px.map(p => p.x), ys = px.map(p => p.y);
      const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
      const zoom = Math.min(maxZoom, cmap.getZoom() + Math.log2(Math.min(aw / Math.max(1, x1 - x0), ah / Math.max(1, y1 - y0))));
      const dx = (x0 + x1) / 2 - (pad.left + aw / 2), dy = (y0 + y1) / 2 - (pad.top + ah / 2);
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1 && Math.abs(zoom - cmap.getZoom()) < .01) break;
      cmap.jumpTo({ center: cmap.unproject([W / 2 + dx, H / 2 + dy]), zoom });
    }
    const cam = { center: cmap.getCenter(), zoom: cmap.getZoom() };
    cmap.jumpTo(start);
    return cam;
  }
  function deselect() {
