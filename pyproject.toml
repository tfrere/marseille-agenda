[project]
name = "marseille-agenda"
version = "0.1.0"
description = "LLM-grounded event agenda for a curated list of Marseille venues"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[openai]>=1.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dotenv>=1.0",
    "icalendar>=6.0",
    "pillow>=12.3.0",
]

[project.scripts]
marseille-agenda = "marseille_agenda.pipeline:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marseille_agenda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: tests that call the LLM through OpenRouter (need OPENROUTER_API_KEY)",
]
addopts = "-m 'not live'"
