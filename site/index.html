  function selectVenue(id) {
    if (!cmap) return;
    const v = venueById[id];
    selected = id;
    syncSelection();
    setRoute(null);
    document.querySelector('.clist').scrollTop = 0;
    if (MOBILE.matches) $('main').scrollTo({ top: 0, behavior: 'smooth' });
    // Generous room: the bubble above the venue, the trip card right of home, and some city around the route.
    const box = $('cmap'), W = box.clientWidth, H = box.clientHeight;
    const pad = MOBILE.matches
      ? { top: Math.round(H * .18) + 40, bottom: Math.round(H * .2) + 40, left: Math.round(W * .12), right: Math.round(W * .12) + 40 }
      : { top: Math.round(H * .2) + 60, bottom: Math.round(H * .18) + 60, left: Math.round(W * .14), right: Math.round(W * .14) + 200 };
    const frame = (coords) => cmap.easeTo({ ...cameraFor([[HOME.lng, HOME.lat], ...coords], pad, 15.5), duration: 900 });
    frame([[v.lng, v.lat]]);
    routeData[id] ||= { state: 'loading' };
    fetchRoute(id).then((data) => {
      routeData[id] = { state: 'ok', data };
      bike[id] = { go: data.go.mins, back: data.back.mins, km: data.go.km, elev: !!data.go.profile, route: true };
      const cache = readBikeCache(); cache[bikeKey(v)] = bike[id]; writeBikeCache(cache);
      if (selected !== id) return;
      setRoute(data.coords, catHex(v.category));
      frame(data.coords);
      syncTrip();
      renderCarteList();
    }).catch(() => {
      routeData[id] = { state: 'error' };
      if (selected === id) syncTrip();
    });
  }

  // ---- Map

  class Toggle3D {
    onAdd() {
      this.box = document.createElement('div');
      this.box.className = 'maplibregl-ctrl maplibregl-ctrl-group';
      this.box.innerHTML = '<button type="button" class="c3d" aria-pressed="false" title="Relief du terrain">3D</button>';
      this.box.firstChild.onclick = () => set3D(!is3D);
      return this.box;
    }
    onRemove() { this.box.remove(); }
  }
  function set3D(on) {
    if (!cmap.getSource('dem-terrain')) return;
    is3D = on;
    const b = $('cmap').querySelector('.c3d');
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
    cmap.setTerrain(on ? { source: 'dem-terrain', exaggeration: 1.4 } : null);
    if (on && cmap.getPitch() < 30) cmap.easeTo({ pitch: DEFAULT_VIEW.pitch, duration: 800 });
  }

  function styleMap() {
    for (const [id, [prop, val]] of Object.entries(MAP_PAINT)) {
      if (cmap.getLayer(id)) try { cmap.setPaintProperty(id, prop, val); } catch (e) { /* layer without that property */ }
    }
    const firstSymbol = cmap.getStyle().layers.find(l => l.type === 'symbol')?.id;
    const dem = { type: 'raster-dem', tiles: [DEM_TILES], encoding: 'terrarium', tileSize: 256, maxzoom: 14, attribution: 'Relief : Mapzen / AWS Terrain Tiles' };
    // Separate sources for hillshade and terrain, as MapLibre recommends.
    cmap.addSource('dem-shade', dem);
    const { attribution, ...demTerrain } = dem;
    cmap.addSource('dem-terrain', demTerrain);
    cmap.addLayer({ id: 'hillshade', type: 'hillshade', source: 'dem-shade', paint: HILLSHADE }, cmap.getLayer('building') ? 'building' : firstSymbol);
    if (cmap.getSource('openmaptiles')) {
      cmap.addLayer({
        id: 'building-3d', type: 'fill-extrusion', source: 'openmaptiles', 'source-layer': 'building', minzoom: 13,
        paint: {
          'fill-extrusion-color': BUILDING_3D,
          // z13 tiles carry footprints without heights: a typical Marseille block height until z14 brings the real ones.
          'fill-extrusion-height': ['interpolate', ['linear'], ['zoom'], 13, 0, 13.8, ['coalesce', ['get', 'render_height'], 12]],
          'fill-extrusion-base': ['interpolate', ['linear'], ['zoom'], 13, 0, 13.8, ['coalesce', ['get', 'render_min_height'], 0]],
          'fill-extrusion-opacity': .85,
        },
      }, firstSymbol);
    }
    cmap.addSource('route', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    const round = { 'line-join': 'round', 'line-cap': 'round' };
    cmap.addLayer({ id: 'route-casing', type: 'line', source: 'route', layout: round,
      paint: { 'line-color': cssVar('--bg'), 'line-width': ['interpolate', ['linear'], ['zoom'], 11, 5, 16, 11], 'line-opacity': .95 } }, firstSymbol);
    cmap.addLayer({ id: 'route-line', type: 'line', source: 'route', layout: round,
      paint: { 'line-color': cssVar('--accent'), 'line-width': ['interpolate', ['linear'], ['zoom'], 11, 2.5, 16, 6] } }, firstSymbol);
    try { cmap.setSky(SKY); } catch (e) { /* older renderer without sky */ }
    if (selected && routeData[selected]?.state === 'ok') setRoute(routeData[selected].data.coords, catHex(venueById[selected].category));
  }

  // ---- Arrondissements (outlines + names, same data as marseille-tes-lieux)

  const ringArea = (r) => Math.abs(r.reduce((s, [x, y], i) => { const [x2, y2] = r[(i + 1) % r.length]; return s + x * y2 - x2 * y; }, 0)) / 2;
  function inRing([x, y], r) {
    let inside = false;
    for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
      const [xi, yi] = r[i], [xj, yj] = r[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }
  function segDist([px, py], [ax, ay], [bx, by]) {
    const dx = bx - ax, dy = by - ay, t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy || 1)));
    return Math.hypot(px - ax - t * dx, py - ay - t * dy);
  }
  // Grid search for the inside point farthest from the edges: the centroid of the coastal and crescent-shaped
  // arrondissements falls outside them or on a border.
  function labelPoint(geom) {
    const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
    const ring = polys.map(p => p[0].map(([x, y]) => [x * LNG_SCALE, y])).sort((a, b) => ringArea(b) - ringArea(a))[0];
    const xs = ring.map(p => p[0]), ys = ring.map(p => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys), N = 24;
    let best = [(x0 + x1) / 2, (y0 + y1) / 2], bestD = -1;
    for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) {
      const p = [x0 + (x1 - x0) * i / N, y0 + (y1 - y0) * j / N];
      if (!inRing(p, ring)) continue;
      let d = Infinity;
      for (let k = 0; k < ring.length - 1; k++) d = Math.min(d, segDist(p, ring[k], ring[k + 1]));
      if (d > bestD) { bestD = d; best = p; }
    }
    return [best[0] / LNG_SCALE, best[1]];
  }
  function addArrondissements(geo) {
    if (!cmap || cmap.getSource('arr')) return;
    const firstSymbol = cmap.getStyle().layers.find(l => l.type === 'symbol')?.id;
    const under = cmap.getLayer('building-3d') ? 'building-3d' : firstSymbol;
    const belowRoute = cmap.getLayer('route-casing') ? 'route-casing' : firstSymbol;
    cmap.addSource('arr', { type: 'geojson', data: geo });
    cmap.addLayer({ id: 'arr-fill', type: 'fill', source: 'arr', paint: { 'fill-color': ARR_INK, 'fill-opacity': .06 } }, under);
    // Outlines above the 3D buildings so the blocks never hide them, under the bike route; a soft halo then a dashed stroke.
    cmap.addLayer({ id: 'arr-halo', type: 'line', source: 'arr', layout: { 'line-join': 'round' },
      paint: { 'line-color': cssVar('--bg'), 'line-opacity': .7, 'line-width': ['interpolate', ['linear'], ['zoom'], 11, 4, 15, 8] } }, belowRoute);
    cmap.addLayer({ id: 'arr-line', type: 'line', source: 'arr', layout: { 'line-join': 'round' },
      paint: { 'line-color': ARR_INK, 'line-opacity': .8, 'line-width': ['interpolate', ['linear'], ['zoom'], 11, 1.6, 15, 3.2], 'line-dasharray': [3, 1.6] } }, belowRoute);
    const points = geo.features.map(f => ({ type: 'Feature', properties: { n: f.properties.n }, geometry: { type: 'Point', coordinates: labelPoint(f.geometry) } }));
    cmap.addSource('arr-labels', { type: 'geojson', data: { type: 'FeatureCollection', features: points } });
    cmap.addLayer({ id: 'arr-label', type: 'symbol', source: 'arr-labels', minzoom: 10, maxzoom: 16,
      layout: { 'text-field': ['get', 'n'], 'text-font': ['Noto Sans Bold'], 'text-size': ['interpolate', ['linear'], ['zoom'], 11, 14, 15, 22], 'text-letter-spacing': .06, 'text-allow-overlap': true },
      paint: { 'text-color': ARR_INK, 'text-opacity': .9, 'text-halo-color': cssVar('--bg'), 'text-halo-width': 2.5 } });
  }

  function initMap(maplibregl) {
    $('cmap').innerHTML = '';
    const box = $('cmap'), fit = Math.min(box.clientWidth / DEFAULT_VIEW.size[0], box.clientHeight / DEFAULT_VIEW.size[1]);
    cmap = new maplibregl.Map({ container: 'cmap', style: MAP_STYLE, center: DEFAULT_VIEW.center, zoom: DEFAULT_VIEW.zoom + Math.log2(fit || 1),
      pitch: DEFAULT_VIEW.pitch, bearing: DEFAULT_VIEW.bearing, maxPitch: 75, maxBounds: MAP_BOUNDS, minZoom: 10, attributionControl: { compact: true } });
    cmap.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
    cmap.addControl(new Toggle3D(), 'top-right');
    const arrP = fetch(ARR_URL).then(r => (r.ok ? r.json() : null)).catch(() => null);
    cmap.on('load', () => { styleMap(); arrP.then(g => g && addArrondissements(g)); });
    const syncZoom = () => {
      const compact = cmap.getZoom() < COMPACT_BELOW_ZOOM;
      if (compact === $('cmap').classList.contains('compact')) return;
      $('cmap').classList.toggle('compact', compact);
    };
    cmap.on('zoom', syncZoom);
    syncZoom();
    cmap.on('moveend', () => {
      const c = cmap.getCenter();
      console.info('[carte] camera', JSON.stringify({ center: [+c.lng.toFixed(5), +c.lat.toFixed(5)], zoom: +cmap.getZoom().toFixed(2), pitch: +cmap.getPitch().toFixed(1), bearing: +cmap.getBearing().toFixed(1), size: [$('cmap').clientWidth, $('cmap').clientHeight] }));
    });
    cmap.on('click', (ev) => { if (!ev.originalEvent.target.closest('.cmk')) deselect(); });

    const home = document.createElement('div');
    home.className = 'chomemk';
    home.innerHTML = `<span class="hic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg></span><span class="hl">${esc(HOME.name)}<span class="htrip" aria-live="polite"></span></span>`;
    new maplibregl.Marker({ element: home, anchor: 'left', offset: [-15, 0] }).setLngLat([HOME.lng, HOME.lat]).addTo(cmap);
    homeEl = home;

    for (const v of mapVenues) {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'cmk';
      el.style.setProperty('--c', `var(--c-${v.category || 'autre'}, var(--c-autre))`);
      el.innerHTML = `<span class="cb"><span class="cimg"></span><span class="ctail"></span><span class="cname">${esc(v.name)}</span></span>`;
      el.addEventListener('click', (ev) => { ev.stopPropagation(); selected === v.id ? deselect() : selectVenue(v.id); });
      markerEls[v.id] = el;
      new maplibregl.Marker({ element: el, anchor: 'bottom' }).setLngLat([v.lng, v.lat]).addTo(cmap);
    }
    syncMarkers();
  }

  // Bubbles follow the period: hidden when the venue has nothing in it (muted in "Tout"), poster of its first event.
  function syncMarkers() {
    for (const v of mapVenues) {
      const el = markerEls[v.id];
      if (!el) continue;
      const evs = eventsAt(v.id), img = evs.find(e => e.image)?.image || '';
      el.classList.toggle('off', state.quand !== 'tout' && !evs.length && v.id !== selected);
      el.classList.toggle('muted', !evs.length);
      el.setAttribute('aria-label', evs.length ? `${v.name}, ${whenShort(evs[0], state.quand)} : ${evs[0].title}` : v.name);
      const box = el.querySelector('.cimg');
      if (box.dataset.img === img) continue;
      box.dataset.img = img;
      box.style.backgroundImage = img ? `url("${img}")` : '';
      box.textContent = img ? '' : initial(v.name);
    }
  }

  function renderCarteTabs() {
    syncNodes($('carteTabs'), Object.keys(CARTE_WHEN),
      (k) => {
        const b = document.createElement('button');
        b.type = 'button'; b.setAttribute('role', 'tab');
        b.innerHTML = `${esc(CARTE_WHEN[k])}<span class="count"></span>`;
        b.onclick = () => { state.quand = k; commit(); };
        return b;
      },
      (b, k) => {
        const on = state.quand === k;
        b.classList.toggle('on', on);
        b.setAttribute('aria-selected', on);
        b.querySelector('.count').textContent = mapVenues.filter(v => eventsAt(v.id, k).length).length;
        b.title = 'Nombre de lieux avec quelque chose';
      });
  }

  // ---- List

  // One card per venue with its events of the period, venues ordered by their next event ("Tout": by genre, then
  // name). The card selects the venue; an event row opens the event.
  const thumbHtml = (img, name) => `<span class="cthumb"${img ? ` style="background-image:url('${esc(img)}')"` : ''}>${img ? '' : esc(initial(name))}</span>`;
  const ROWS_PER_VENUE = 3;
  function rowWhen(e, k) {
    if (isRange(e)) return `→ ${fmtDate(e.end_date)}`;
    if (k === 'aujourdhui') return timeLabel(e) || 'journée';
    return whenShort(e, k === 'tout' ? 'tout' : 'semaine');
  }
  function carteItems(k) {
    if (k === 'tout') {
      const groups = Object.keys(CATEGORIES).map(c => [c, mapVenues.filter(v => (v.category || 'autre') === c)]).filter(([, vs]) => vs.length);
      return groups.flatMap(([c, vs]) => [{ key: `g:${c}`, cat: c, n: vs.length },
        ...[...vs].sort((a, b) => a.name.localeCompare(b.name, 'fr')).map(v => ({ key: `v:${v.id}`, v, evs: eventsAt(v.id, k) }))]);
    }
    const first = (evs) => `${evs[0].start_date < todayStr ? todayStr : evs[0].start_date} ${timeKey(evs[0])}`;
    return mapVenues.map(v => ({ key: `v:${v.id}`, v, evs: eventsAt(v.id, k) })).filter(it => it.evs.length)
      .sort((a, b) => first(a.evs).localeCompare(first(b.evs)) || a.v.name.localeCompare(b.v.name, 'fr'));
  }
  function itemNode(it) {
    const li = document.createElement('li');
    if (it.cat) {
      li.className = 'chead';
      li.setAttribute('role', 'presentation');
      li.style.setProperty('--c', `var(--c-${it.cat}, var(--c-autre))`);
      li.innerHTML = `<span class="dot"></span><span>${esc(CATEGORIES[it.cat])}</span><span class="k"></span>`;
      return li;
    }
    const v = it.v;
    li.className = 'cgroup';
    li.style.setProperty('--c', `var(--c-${v.category || 'autre'}, var(--c-autre))`);
    li.onclick = () => (selected === v.id ? deselect() : selectVenue(v.id));
    li.onmouseenter = () => markerEls[v.id]?.classList.add('hover');
    li.onmouseleave = () => markerEls[v.id]?.classList.remove('hover');
    return li;
  }
  function fillItem(li, it, k, seq) {
    if (it.cat) { li.querySelector('.k').textContent = it.n; return; }
    const v = it.v, evs = it.evs, shown = evs.slice(0, k === 'tout' ? 1 : ROWS_PER_VENUE);
    li.classList.toggle('on', v.id === selected);
    li.classList.toggle('muted', !evs.length);
    const meta = [k === 'tout' ? areaName(venueArea[v.id]) : CATEGORIES[v.category] || v.category, k === 'tout' ? '' : areaName(venueArea[v.id]),
      bike[v.id] ? `${fmtMins(bike[v.id].go)} à vélo` : ''].filter(Boolean).join(' · ');
    li.innerHTML = `<div class="ghead">${thumbHtml(evs.find(e => e.image)?.image, v.name)}
        <div style="min-width:0"><div class="gname">${esc(v.name)}</div><div class="gmeta"><span class="dot"></span>${esc(meta)}</div></div></div>
      ${shown.length ? `<ul class="grows">${shown.map(e => `<li><button type="button" class="grow${e.status === 'cancelled' ? ' cancelled' : ''}" data-uid="${esc(e.uid)}">
        <span class="cwhen">${esc(rowWhen(e, k))}</span><span class="gt">${esc(e.title)}</span></button></li>`).join('')}</ul>` : ''}
      ${evs.length > shown.length ? `<div class="gmore">+ ${evs.length - shown.length} ${k === 'tout' ? 'à venir' : 'autres'}</div>` : ''}
      ${!evs.length ? '<div class="gmore">rien à venir</div>' : ''}`;
    for (const b of li.querySelectorAll('.grow')) {
      b.onclick = (ev) => { ev.stopPropagation(); carteSeq = seq; openModal(byUid.get(b.dataset.uid)); };
    }
  }
  function renderCarteList() {
    const k = state.quand, items = carteItems(k);
    const seq = items.flatMap(it => it.evs || []);
    const places = items.filter(it => it.v && it.evs.length).length;
    $('carteLead').textContent = k === 'tout' ? lieux(mapVenues.length)
      : seq.length ? `${plural(seq.length, 'événement')} dans ${lieux(places)}` : `Rien ${CARTE_EMPTY[k]}`;
    $('carteNote').textContent = bikeState === 'error' ? 'Temps à vélo indisponibles (service de calcul injoignable).' : '';
    const list = $('carteList');
    syncNodes(list, items.map(it => it.key), (key) => itemNode(items.find(it => it.key === key)),
      (li, key) => fillItem(li, items.find(it => it.key === key), k, seq));
    for (const it of items) list.appendChild(list.querySelector(`[data-key="${CSS.escape(it.key)}"]`));
  }

  async function renderCarte() {
    if (bikeState === 'idle') {
      bikeState = 'loading';
      computeBike()
        .then(b => { bike = { ...b, ...bike }; bikeState = 'ok'; })
        .catch(() => { bikeState = 'error'; })
        .finally(() => { if (state.view === 'carte') renderCarteList(); });
    }
    renderCarteTabs();
    renderCarteList();
    try {
      const maplibregl = await loadMaplibre();
      if (state.view !== 'carte') return;
      if (!cmap) initMap(maplibregl);
      syncMarkers();
      renderDetail();
      cmap.resize();
    } catch (e) {
      // Library blocked by the network, or no WebGL in this browser.
      cmap = null;
      $('cmap').innerHTML = '<p class="cfail">Carte indisponible dans ce navigateur.</p>';
    }
  }

  // ---- Wiring -----------------------------------------------------------------------------

  for (const t of document.querySelectorAll('#tabs .tab')) t.onclick = () => goto({ view: t.dataset.view });
  const shiftMonth = (n) => { const d = dateOf(state.month + '-01'); d.setMonth(d.getMonth() + n); state.month = iso(d).slice(0, 7); commit(); };
  $('prev').onclick = () => shiftMonth(-1);
  $('next').onclick = () => shiftMonth(1);
  let qTimer;
  $('q').oninput = (ev) => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = ev.target.value.trim(); commit(); }, SEARCH_DEBOUNCE_MS); };
  $('q').onkeydown = (ev) => { if (ev.key === 'Enter') { clearTimeout(qTimer); state.q = ev.target.value.trim(); commit(); } };
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') {
      if (!pop.hidden) { closePop(); return; }
      if (!infoPop.hidden) { setInfo(false); return; }
      if (!modal.hidden) { closeModal(); return; }
      if (state.view === 'carte' && selected) { deselect(); return; }
      if (state.lieux) closeLieux();
      return;
    }
    if (!modal.hidden) {
      if (ev.key === 'ArrowLeft') stepModal(-1);
      if (ev.key === 'ArrowRight') stepModal(1);
      return;
    }
    if (ev.target.matches('input, textarea, select') || !pop.hidden || state.view !== 'agenda') return;
    if (ev.key === 'ArrowLeft') $('prev').click();
    if (ev.key === 'ArrowRight') $('next').click();
  });
  // Mobile: collapse the filter rows after ~80 px of downward scroll, reveal on scroll up.
  let lastY = 0;
  $('main').addEventListener('scroll', () => {
    if (!MOBILE.matches) return;
    const y = $('main').scrollTop;
    $('header').classList.toggle('collapsed', y > 80 && y > lastY);
    lastY = y;
  }, { passive: true });
  let resizeTimer;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (state.view === 'agenda') renderAgenda(); }, 120); });
  // Read the hash, render, then rewrite it in canonical form (legacy #expos / #agenda?when=.. redirect here).
  const syncFromHash = () => {
    const before = `${state.view}/${state.tab}/${state.day}`;
    readHash();
    $('q').value = state.q;
    render();
    writeHash();
    if (`${state.view}/${state.tab}/${state.day}` !== before) $('main').scrollTop = 0;
  };
  window.addEventListener('hashchange', syncFromHash);
  syncFromHash();
})();
</script>
</body>
</html>
